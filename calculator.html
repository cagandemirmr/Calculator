<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .calculator-border{
            border-top: 100px;
            width: 600px;
            height: 600px;
            border-radius: 20px;
            background-color: orange;
            display: flex;
            align-items:center;
            
            flex-direction: column;
            
            
        }

        .screen{
            width: 550px;
            height: 120px;
            margin-top: 20px;
            
            background-color:rgb(208, 200, 200);
            border-radius: 20px;
        }

        .action{
            display: flex;
            flex-direction: row;
            margin-top: 40px;
            align-items: start;
        }
        .numbers{
            
            width:300px;
            margin-right: 20px;
            
        }

        

        .number {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 4px;
            
        }
        #zero{
            margin-left: 90px;
        }

        .operator{
            
            width:200px;

        }
        #clear{
            width: 170px;
            height: 80px;
            border-radius: 20%;
            text-align: center;
        }
        .numbers{
            margin-left: 20px;
        }

        .operations{
            width:200px;
            
            
        }
        .operator{
            width: 80px;
            height: 80px;
            margin: 4px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="calculator-border">
        <div class="screen">

        </div>
        <div class="action">
            <div class="numbers">
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="number" id="zero">0</button>

            </div>
            <div class="operations">
                <button class="operator" id="clear">Clear</button>
                <button class="operator" id="equal">=</button>
                <button class="operator" id="add">+</button>
                <button class="operator" id="sub">-</button>
                <button class="operator" id="div">/</button>
                <button class="operator" id="mul">*</button>
                
            </div>
        </div>
    </div>
    
    
</body>
<script>

    // Bu fonksiyonlarda şu olmalı ilk olarak digit girdikten ve tuşa basıldıktan sonra aktif olmalı.
    // Bütün bu sayıları tek bir array e atarız.
    // Clear a bastığımızda da tüm bu array i boşaltırız.
</script>
</html>
